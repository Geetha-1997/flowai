name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/flowai/values.yaml"
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall backend
      - uses: azure/setup-helm@v4
      - run: helm lint helm/flowai

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=short,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Update image tag in Helm values
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA::7}"
          sed -i "s|^  repository:.*|  repository: ${REPO}|" helm/flowai/values.yaml
          sed -i "s|^  tag:.*|  tag: \"${TAG}\"|" helm/flowai/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/flowai/values.yaml
          git commit -m "ci: deploy ${TAG} [skip ci]" || echo "no changes"
          git push