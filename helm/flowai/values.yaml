replicaCount: 2

image:
  repository: flowai
  tag: "1.0"
  pullPolicy: IfNotPresent

# Created outside Git: kubectl create secret generic flowai-secrets --from-env-file=.env
secretName: flowai-secrets

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
    