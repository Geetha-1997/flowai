apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Geetha-1997/flowai.git
    targetRevision: main
    path: helm/flowai
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true