<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowAI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button class="side-btn" id="newChat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        New chat
      </button>
      <div class="side-label">Chats</div>
      <nav class="chat-list" id="chatList"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main is-empty" id="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="brand">FlowAI</div>
        <span class="notice" id="status"></span>
      </header>

      <section class="messages" id="messages">
        <div class="thread" id="thread"></div>
      </section>

      <div class="dock">
        <h2 class="greeting">What can I help with?</h2>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
          <button type="submit" class="send" id="sendBtn" disabled aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <button type="button" class="send hidden" id="stopBtn" aria-label="Stop">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
        </form>
        <p class="disclaimer">FlowAI can make mistakes. Check important info.</p>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
